<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>结算完成</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #222;
}
body { min-height: 100vh; }
.app {
    min-height: 100vh;
    padding-bottom: 132px;
    background: linear-gradient(#eaf5ff 0, #f6f6f6 38%, #f7f7f7 100%);
}
.nav {
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-size: 24px;
    font-weight: 600;
}
.back {
    position: absolute;
    left: 28px;
    top: 28px;
    width: 17px;
    height: 17px;
    border-left: 3px solid #222;
    border-bottom: 3px solid #222;
    transform: rotate(45deg);
    border-radius: 1px;
}
.summary {
    text-align: center;
    padding: 12px 16px 36px;
}
.check-circle {
    width: 76px;
    height: 76px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: #f0f9f2;
    display: flex;
    align-items: center;
    justify-content: center;
}
.check-circle::before {
    content: "✓";
    font-size: 32px;
    font-weight: 700;
    color: #2fba73;
}
.summary-title {
    font-size: 22px;
    font-weight: 700;
}
.summary-sub {
    margin-top: 12px;
    color: #858585;
    font-size: 15px;
}
.cards { padding: 0 16px; }
.card {
    background: #fff;
    border-radius: 18px;
    padding: 23px 22px 20px;
    margin-bottom: 16px;
}
.card-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: #777;
    font-size: 15px;
    line-height: 1.35;
    padding-bottom: 20px;
    border-bottom: 1px solid #f1f1f1;
}
.badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 11px;
    border-radius: 99px;
    background: #f0f9f2;
    color: #2fba73;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
}
.card-main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding-top: 26px;
}
.label {
    font-size: 16px;
    color: #555;
    margin-bottom: 14px;
}
.amount {
    font-size: 26px;
    font-weight: 700;
}
.interest { text-align: right; }
.interest .amount { text-align: right; }
.subtotal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px dashed #f0f0f0;
    font-size: 14px;
    color: #999;
}
.subtotal .sub-amount {
    font-size: 16px;
    font-weight: 700;
    color: #222;
}
.more {
    color: #999;
    text-align: center;
    font-size: 16px;
    padding: 5px 0 16px;
}
.more::after {
    content: "›";
    display: inline-block;
    margin-left: 6px;
    font-size: 22px;
    vertical-align: -2px;
}
.footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96);
    border-top: 1px solid #eee;
    backdrop-filter: blur(10px);
}
.footer-note {
    text-align: center;
    font-size: 12px;
    color: #a3a3a3;
    margin-bottom: 10px;
}
.repay {
    width: 100%;
    height: 58px;
    border: 0;
    border-radius: 17px;
    background: #4d90f6;
    color: #fff;
    font-size: 22px;
    font-weight: 600;
}
@media (min-width: 600px) {
    .app {
        max-width: 430px;
        margin: 0 auto;
    }
    .footer {
        max-width: 430px;
        left: 50%;
        right: auto;
        width: 100%;
        transform: translateX(-50%);
    }
}
</style>
</head>

<body>
<div class="app">
    <div class="nav">
        <span class="back"></span>
        <span>结算完成</span>
    </div>

    <div class="summary">
        <div class="check-circle"></div>
        <div class="summary-title">已全部还清</div>
        <div class="summary-sub">结算日期 2026年9月26日 · 结算2笔，共¥6,354.78</div>
    </div>

    <div class="cards">
        <div class="card">
            <div class="card-top">
                <div>2025年5月23日借款 ¥7,500</div>
                <div class="card-top-right">
                    <span class="badge">已结算</span>
                </div>
            </div>
            <div class="card-main">
                <div>
                    <div class="label">已还本金</div>
                    <div class="amount">¥3,130.43</div>
                </div>
                <div class="interest">
                    <div class="label">结算利息</div>
                    <div class="amount">¥46.96</div>
                </div>
            </div>
            <div class="subtotal">
                <span>结算金额</span>
                <span class="sub-amount">¥3,177.39</span>
            </div>
        </div>

        <div class="card">
            <div class="card-top">
                <div>2025年5月23日借款 ¥7,500</div>
                <div class="card-top-right">
                    <span class="badge">已结算</span>
                </div>
            </div>
            <div class="card-main">
                <div>
                    <div class="label">已还本金</div>
                    <div class="amount">¥3,130.43</div>
                </div>
                <div class="interest">
                    <div class="label">结算利息</div>
                    <div class="amount">¥46.96</div>
                </div>
            </div>
            <div class="subtotal">
                <span>结算金额</span>
                <span class="sub-amount">¥3,177.39</span>
            </div>
        </div>

        <div class="more">结算凭证</div>
    </div>

    <div class="footer">
        <div class="footer-note">结算凭证编号 LN-20260926-882913 · 金额以结算系统为准</div>
        <button class="repay">查看结算凭证</button>
    </div>
</div>
</body>
</html>
